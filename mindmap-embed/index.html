<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <link rel="icon" href="dist/logo.ico">
    <title>思维导图</title>
    <script>
        // 自定义静态资源的路径
        window.externalPublicPath = './dist/'
        // 接管应用
        window.takeOverApp = true
    </script>
    <link href="dist/css/chunk-vendors.css" rel="stylesheet">
    <link href="dist/css/app.css" rel="stylesheet">
</head>
<body>
    <noscript>
        <strong>We're sorry but thoughts doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script>
        const isBackgroundExport = new URLSearchParams(window.location.search).has('backgroundExport');
        // 从父窗口获取数据
        const getDataFromParent = () => {
            return new Promise((resolve, reject) => {
                // 发送消息给父窗口请求数据
                window.parent.postMessage(JSON.stringify({
                    event: 'request_data'
                }), '*');
                
                // 监听父窗口的响应
                const messageHandler = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.event === 'init_data') {
                            clearTimeout(initTimeout);
                            window.removeEventListener('message', messageHandler);
                            resolve({
                                mindMapData: message.mindMapData || {
                                    root: {
                                        data: {
                                            text: '根节点'
                                        },
                                        children: []
                                    },
                                    theme: {
                                        template: 'lemonBubbles',
                                        config: {                                    // 图片显示的最大宽度
                                            imgMaxWidth: 350,
                                            // 图片显示的最大高度
                                            imgMaxHeight: 200,
                                            root:{
                                                shape: "rectangle"
                                            },
                                            second: {
                                                fontSize: 24,
                                                shape: "rectangle"
                                            },
                                            node: {
                                                fontSize: 24,
                                                borderColor: "#4D4D4D",
                                                borderWidth: 2
                                            }
                                        }
                                    },
                                    layout: 'logicalStructure',
                                    config: {},
                                    view: null
                                },
                                mindMapConfig: message.mindMapConfig || {},
                                lang: message.lang || 'zh',
                                localConfig: message.localConfig || null,
                                blockSettings: message.blockSettings || null
                            });
                        }
                    } catch (err) {
                        console.error('Parse message error:', err);
                    }
                };
                
                window.addEventListener('message', messageHandler);
                
                // 超时处理
                const initTimeout = setTimeout(() => {
                    window.removeEventListener('message', messageHandler);
                    if (isBackgroundExport) {
                        window.parent.postMessage(JSON.stringify({
                            event: 'export_error',
                            error: '后台导出未收到导图数据'
                        }), '*');
                        reject(new Error('后台导出未收到导图数据'));
                        return;
                    }
                    resolve({
                        mindMapData: {
                            root: {
                                data: {
                                    text: '根节点'
                                },
                                children: []
                            },
                            theme: {
                                template: 'lemonBubbles',
                                config: {
                                    // 图片显示的最大宽度
                                    imgMaxWidth: 350,
                                    // 图片显示的最大高度
                                    imgMaxHeight: 200,
                                    root: {
                                        shape: "rectangle"
                                    },
                                    second: {
                                        fontSize: 24,
                                        shape: "rectangle"
                                    },
                                    node: {
                                        fontSize: 24,
                                        borderColor: "#4D4D4D",
                                        borderWidth: 2
                                    }
}
                            },
                            layout: 'logicalStructure',
                            config: {},
                            view: null
                        },
                        mindMapConfig: {},
                        lang: 'zh',
                        localConfig: null,
                        blockSettings: null
                    });
                }, isBackgroundExport ? 10000 : 1000);
            });
        };
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 校验思维导图数据是否有效（避免在数据为空或无意义时保存）
        function isValidMindMapData(mindMapData) {
            if (!mindMapData) return false;
            const root = mindMapData.root;
            if (!root) return false;

            // 如果根节点有非空文本或存在子节点，则认为有效
            const hasText = root.data && typeof root.data.text === 'string' && root.data.text.trim() !== '';
            const hasChildren = Array.isArray(root.children) && root.children.length > 0;
            return hasText || hasChildren;
        }
        
                const setTakeOverAppMethods = data => {
            window.takeOverAppMethods = {};
            
            // 获取思维导图数据的函数
            window.takeOverAppMethods.getMindMapData = () => {
                return data.mindMapData;
            };
            
            // 保存思维导图数据的函数（带防抖）。后台导出实例不发送保存请求。
            const saveMindMapDataDebounced = debounce((mindMapData) => {
                if (isBackgroundExport) return;
                if (!isValidMindMapData(mindMapData)) {
                    console.warn('Skipped saving invalid or empty mindMapData');
                    return;
                }
                window.parent.postMessage(JSON.stringify({
                    event: 'save',
                    data: mindMapData
                }), '*');
            }, 500);
            
            window.takeOverAppMethods.saveMindMapData = mindMapData => {
                if (isBackgroundExport) return;
                if (!isValidMindMapData(mindMapData)) {
                    console.warn('takeOverAppMethods.saveMindMapData: skipped invalid or empty data');
                    return;
                }
                saveMindMapDataDebounced(mindMapData);
            };
            
            // 获取思维导图配置
            window.takeOverAppMethods.getMindMapConfig = () => {
                return {
                    ...(data.mindMapConfig || {}),
                    // 每次打开编辑器都展示整张导图，不沿用旧的缩放和偏移。
                    fit: !isBackgroundExport,
                    viewData: null,
                    minZoomRatio: 10,
                    mousewheelZoomRatio: 0.1
                };
            };
            
            // 保存思维导图配置
            window.takeOverAppMethods.saveMindMapConfig = config => {
                if (isBackgroundExport) return;
                window.parent.postMessage(JSON.stringify({
                    event: 'save_config',
                    config: config
                }), '*');
            };
            
            // 获取语言的函数
            window.takeOverAppMethods.getLanguage = () => {
                return data.lang;
            };
            
            // 保存语言的函数
            window.takeOverAppMethods.saveLanguage = lang => {
                window.parent.postMessage(JSON.stringify({
                    event: 'save_language',
                    lang: lang
                }), '*');
            };
            
            // 获取本地配置的函数
            window.takeOverAppMethods.getLocalConfig = () => {
                return data.localConfig;
            };
            
            // 保存本地配置的函数
            window.takeOverAppMethods.saveLocalConfig = config => {
                window.parent.postMessage(JSON.stringify({
                    event: 'save_local_config',
                    config: config
                }), '*');
            };
            
            // 获取块设置的函数
            window.takeOverAppMethods.getBlockSettings = () => {
                return data.blockSettings || null;
            };
            
            // 保存块设置的函数
            window.takeOverAppMethods.saveBlockSettings = settings => {
                data.blockSettings = settings;
                window.parent.postMessage(JSON.stringify({
                    event: 'save_block_setting',
                    settings: settings
                }), '*');
            };
        };
        
        window.onload = async () => {
            if (!window.takeOverApp) return;
            
            // 请求数据
            const data = await getDataFromParent();
            
            // 设置全局的方法
            setTakeOverAppMethods(data);
   
            
            // 手动保存函数（立即保存，不防抖）
            const manualSave = () => {
                if (window.mindMapInstance) {
                    try {

                        
                        const mindMapData = window.mindMapInstance.getData(true);
                        if (!isValidMindMapData(mindMapData)) {
                            console.warn('Manual save skipped: invalid or empty mindMapData');
                            return;
                        }
                        
                        window.parent.postMessage(JSON.stringify({
                            event: 'save',
                            data: mindMapData,
                            via: 'manual'
                        }), '*');
                    } catch (err) {
                        console.error('Manual save error:', err);
                        // 发生错误时也要重新启用标签页切换
                    }
                }
            };
            
            // 自动保存函数
            const autoSave = () => {
                if (window.mindMapInstance) {
                    try {
                        const mindMapData = window.mindMapInstance.getData(true);
                        if (!isValidMindMapData(mindMapData)) {
                            console.warn('Auto save skipped: invalid or empty mindMapData');
                            return;
                        }
                        window.parent.postMessage(JSON.stringify({
                            event: 'save',
                            data: mindMapData
                        }), '*');
                    } catch (err) {
                        console.error('Auto save error:', err);
                    }
                }
            };

            // 自动保存已取消：不再启动定时保存或监听窗口可见/聚焦状态
            
            // 思维导图实例创建完成事件
            window.$bus.$on('app_inited', mindMap => {
                window.mindMapInstance = mindMap;
                const notifyReady = () => window.parent.postMessage(JSON.stringify({
                    event: 'app_inited'
                }), '*');
                if (isBackgroundExport) {
                    // 初次渲染是异步的，等节点实际绘制完再开始导出。
                    const onRenderEnd = () => {
                        mindMap.off('node_tree_render_end', onRenderEnd);
                        notifyReady();
                    };
                    mindMap.on('node_tree_render_end', onRenderEnd);
                } else {
                    // 编辑器会补充节点 ID 等内部字段，以渲染后的数据作为内容比较基线。
                    const onRenderEnd = () => {
                        mindMap.off('node_tree_render_end', onRenderEnd);
                        window.parent.postMessage(JSON.stringify({
                            event: 'editor_ready',
                            data: mindMap.getData(true)
                        }), '*');
                    };
                    mindMap.on('node_tree_render_end', onRenderEnd);
                    notifyReady();
                }
                // 自动保存已取消，保留手动保存功能

                // 思源笔记块链接悬浮预览功能
                // 只在链接图标上触发预览，链接文字仍可正常选择和编辑。
                const siyuanBlockLinkRegex = /^siyuan:\/\/blocks\/([0-9a-zA-Z-]+)$/;
                let hoverTimeout = null;
                
                document.addEventListener('mouseover', (e) => {
                    if (!(e.target instanceof Element)) return;
                    const iconElement = e.target.closest('.smm-link-icon');
                    if (!iconElement) return;
                    if (e.relatedTarget instanceof Node && iconElement.contains(e.relatedTarget)) return;
                    // 支持富文本链接前的图标和节点自带的超链接图标。
                    const linkElement = iconElement.closest('a');
                    if (!linkElement) return;
                    
                    // 获取 href 属性（SVG 中可能是 xlink:href 或 href）
                    const href = linkElement.getAttribute('href') || 
                                 linkElement.getAttribute('xlink:href') ||
                                 linkElement.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
                    if (!href) return;
                    
                    // 检查是否是思源块链接
                    if (!href.startsWith('siyuan://blocks/')) return;
                    
                    const match = href.match(siyuanBlockLinkRegex);
                    if (!match) return;
                    
                    const blockId = match[1];
                    
                    // 使用图标的位置定位浮窗。
                    const rect = iconElement.getBoundingClientRect();
                    // 获取 iframe 相对于父窗口的位置
                    let iframeOffsetX = 0;
                    let iframeOffsetY = 0;
                    try {
                        const iframeRect = window.frameElement?.getBoundingClientRect();
                        if (iframeRect) {
                            iframeOffsetX = iframeRect.left;
                            iframeOffsetY = iframeRect.top;
                        }
                    } catch (err) {
                        // 跨域访问可能失败
                    }
                    
                    // 清除之前的定时器
                    if (hoverTimeout) {
                        clearTimeout(hoverTimeout);
                    }
                    
                    // 延迟一点时间再显示悬浮预览，避免快速划过时频繁触发
                    hoverTimeout = setTimeout(() => {
                        hoverTimeout = null;
                        if (!iconElement.isConnected) return;
                        window.parent.postMessage(JSON.stringify({
                            event: 'hover_block_link',
                            blockId: blockId,
                            x: rect.left + iframeOffsetX,
                            y: rect.bottom + iframeOffsetY
                        }), '*');
                    }, 300);
                });
                
                // 鼠标离开时清除定时器
                document.addEventListener('mouseout', (e) => {
                    if (!(e.target instanceof Element)) return;
                    const iconElement = e.target.closest('.smm-link-icon');
                    if (!iconElement) return;
                    if (e.relatedTarget instanceof Node && iconElement.contains(e.relatedTarget)) return;
                    const linkElement = iconElement.closest('a');
                    if (!linkElement) return;
                    const href = linkElement.getAttribute('href') || 
                                 linkElement.getAttribute('xlink:href') ||
                                 linkElement.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
                    if (href && href.startsWith('siyuan://blocks/') && hoverTimeout) {
                        clearTimeout(hoverTimeout);
                        hoverTimeout = null;
                    }
                });
            });
            
            // 监听 Ctrl+S 快捷键
            document.addEventListener('keydown', (event) => {
                // Ctrl+S 或 Cmd+S (Mac)
                if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                    event.preventDefault(); // 阻止浏览器默认保存行为
                    manualSave();
                }
            });
            
            // 监听来自父窗口的消息
            window.addEventListener('message', async (event) => {
                try {
                    const message = JSON.parse(event.data);
                    
                    // 监听保存成功的消息
                    if (message.event === 'save_confirmed') {
                        // 触发 save_success 事件，让 Count 组件更新保存时间
                        window.$bus.$emit('save_success');
                    }
                    
                    if (message.action === 'export_image') {
                        if (window.mindMapInstance) {
                            try {
                                const type = message.type || 'png';
                                const exportData = await window.mindMapInstance.export(type, false, 'mindmap', false);
                                window.parent.postMessage(JSON.stringify({
                                    event: 'export_success',
                                    data: exportData,
                                    callbackId: message.callbackId
                                }), '*');
                            } catch (e) {
                                console.error('Export failed:', e);
                                window.parent.postMessage(JSON.stringify({
                                    event: 'export_error',
                                    error: e.message,
                                    callbackId: message.callbackId
                                }), '*');
                                // 导出失败也要重新启用标签页切换
                            }
                        } else {
                            console.error('mindMapInstance not available');
                        }
                    }
                } catch (err) {
                    // Ignore parse errors for non-JSON messages
                    if (err.message && !err.message.includes('JSON')) {
                        console.error('Message parse error:', err);
                    }
                }
            });
            
            // 实例化页面
            window.initApp();
            
            // 页面卸载时清理（自动保存已取消，无需移除相关监听器）
            window.addEventListener('beforeunload', () => {
                // 自动保存已取消，无需清理定时器或可见性/焦点监听器
            });
        };
    </script>
    <script src="dist/js/chunk-vendors.js"></script>
    <script src="dist/js/app.js"></script>
</body>
</html>
